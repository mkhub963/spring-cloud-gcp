# IMPORTANT SECURITY NOTE:
# This ConfigMap contains SQL scripts with placeholder passwords.
# In production:
# 1. Replace 'YourSecurePassword' with references to Kubernetes Secrets
# 2. Use environment variable substitution in init scripts
# 3. Never commit actual passwords to version control
# 4. Consider using external secret management systems (e.g., Azure Key Vault, HashiCorp Vault)
apiVersion: v1
kind: ConfigMap
metadata:
  name: oracle-init-scripts
  labels:
    app: oracle
data:
  01-create-user.sql: |
    -- Create application user in pluggable database
    ALTER SESSION SET CONTAINER=ORCLPDB1;
    
    -- Create user
    -- Note: Replace 'YourSecurePassword' with actual password from Secret
    CREATE USER appuser IDENTIFIED BY "YourSecurePassword";
    
    -- Grant privileges
    GRANT CONNECT, RESOURCE TO appuser;
    GRANT CREATE SESSION TO appuser;
    GRANT CREATE TABLE TO appuser;
    GRANT CREATE VIEW TO appuser;
    GRANT CREATE SEQUENCE TO appuser;
    GRANT CREATE PROCEDURE TO appuser;
    GRANT UNLIMITED TABLESPACE TO appuser;
    
    EXIT;
  
  02-create-schema.sql: |
    -- Create application schema
    ALTER SESSION SET CONTAINER=ORCLPDB1;
    
    -- Connect as application user
    -- Note: Replace 'YourSecurePassword' with actual password from Secret
    CONNECT appuser/YourSecurePassword@//localhost:1521/ORCLPDB1;
    
    -- Create tables
    CREATE TABLE users (
      id NUMBER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      username VARCHAR2(100) NOT NULL UNIQUE,
      email VARCHAR2(255) NOT NULL,
      created_date TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      updated_date TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    CREATE TABLE roles (
      id NUMBER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      role_name VARCHAR2(50) NOT NULL UNIQUE,
      description VARCHAR2(255)
    );
    
    CREATE TABLE user_roles (
      user_id NUMBER NOT NULL,
      role_id NUMBER NOT NULL,
      assigned_date TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (user_id, role_id),
      FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
      FOREIGN KEY (role_id) REFERENCES roles(id) ON DELETE CASCADE
    );
    
    -- Create indexes
    CREATE INDEX idx_users_email ON users(email);
    CREATE INDEX idx_users_username ON users(username);
    
    -- Insert sample data
    INSERT INTO roles (role_name, description) VALUES ('ADMIN', 'Administrator role');
    INSERT INTO roles (role_name, description) VALUES ('USER', 'Standard user role');
    INSERT INTO roles (role_name, description) VALUES ('GUEST', 'Guest user role');
    
    COMMIT;
    EXIT;
  
  03-create-procedures.sql: |
    -- Create stored procedures
    ALTER SESSION SET CONTAINER=ORCLPDB1;
    -- Note: Replace 'YourSecurePassword' with actual password from Secret
    CONNECT appuser/YourSecurePassword@//localhost:1521/ORCLPDB1;
    
    -- Procedure to update user's updated_date on modification
    CREATE OR REPLACE TRIGGER trg_users_update
    BEFORE UPDATE ON users
    FOR EACH ROW
    BEGIN
      :NEW.updated_date := CURRENT_TIMESTAMP;
    END;
    /
    
    -- Function to get user count
    CREATE OR REPLACE FUNCTION get_user_count
    RETURN NUMBER
    IS
      v_count NUMBER;
    BEGIN
      SELECT COUNT(*) INTO v_count FROM users;
      RETURN v_count;
    END;
    /
    
    COMMIT;
    EXIT;
