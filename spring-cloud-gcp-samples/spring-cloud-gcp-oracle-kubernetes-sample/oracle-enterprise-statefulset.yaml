apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oracle-db
  labels:
    app: oracle
    edition: enterprise
spec:
  serviceName: oracle-db-service
  replicas: 1
  selector:
    matchLabels:
      app: oracle
      edition: enterprise
  template:
    metadata:
      labels:
        app: oracle
        edition: enterprise
    spec:
      imagePullSecrets:
        - name: oracle-registry
      containers:
      - name: oracle-database
        image: container-registry.oracle.com/database/enterprise:19.3.0.0
        ports:
        - containerPort: 1521
          name: oracle-listener
        - containerPort: 5500
          name: oracle-em
        env:
        - name: ORACLE_SID
          value: "ORCLCDB"
        - name: ORACLE_PDB
          value: "ORCLPDB1"
        - name: ORACLE_PWD
          valueFrom:
            secretKeyRef:
              name: oracle-secrets
              key: oracle-password
        - name: ORACLE_CHARACTERSET
          value: "AL32UTF8"
        - name: ORACLE_EDITION
          value: "enterprise"
        volumeMounts:
        - name: oracle-storage
          mountPath: /opt/oracle/oradata
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "8Gi"
            cpu: "4"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              echo "SELECT 1 FROM DUAL;" | sqlplus -s system/${ORACLE_PWD}@//localhost:1521/ORCLCDB | grep -q "^1"
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              echo "SELECT 1 FROM DUAL;" | sqlplus -s system/${ORACLE_PWD}@//localhost:1521/ORCLCDB | grep -q "^1"
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
  volumeClaimTemplates:
  - metadata:
      name: oracle-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      # For Azure Kubernetes Service (AKS)
      storageClassName: "managed-premium"
      # For Google Kubernetes Engine (GKE), use:
      # storageClassName: "premium-rwo"
      resources:
        requests:
          storage: 100Gi
