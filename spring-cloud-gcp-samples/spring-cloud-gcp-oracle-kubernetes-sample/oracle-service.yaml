apiVersion: v1
kind: Service
metadata:
  name: oracle-db-service
  labels:
    app: oracle
spec:
  type: ClusterIP
  selector:
    app: oracle
  ports:
  - name: oracle-listener
    protocol: TCP
    port: 1521
    targetPort: 1521
  - name: oracle-em-express
    protocol: TCP
    port: 5500
    targetPort: 5500
---
# Optional: LoadBalancer service for external access
# Use with caution in production environments
apiVersion: v1
kind: Service
metadata:
  name: oracle-db-external
  labels:
    app: oracle
spec:
  type: LoadBalancer
  selector:
    app: oracle
  ports:
  - name: oracle-listener
    protocol: TCP
    port: 1521
    targetPort: 1521
